# TalkyTalky — Hyprland keybinds
# Add to hyprland.conf:   source = ~/.config/hypr/talkytalky.conf
#
# Push-to-talk: hold SUPER+V, release to transcribe.
# `bindr` fires on key release, so no evdev/input-group permissions needed.
bind  = SUPER, V, exec, talkytalky-record-start
bindr = SUPER, V, exec, voxtype record stop

# Toggle mode (press once to start, again to stop) — uncomment if you prefer it:
# bind = SUPER SHIFT, V, exec, talkytalky record toggle

