# TalkyTalky — Hyprland keybinds
# Add to hyprland.conf *after* Omarchy's defaults:   source = ~/.config/hypr/talkytalky.conf
#
# Uses the same keys Omarchy already reserves for voxtype dictation
# (default/hypr/bindings/utilities.conf), so nothing else is displaced:
#   F9              hold to talk, release to transcribe
#   SUPER+CTRL+X    toggle: press to start, press again to stop
# We rebind them through talkytalky-record-start so the focused window is
# snapshotted for the vault note.

unbind = , F9
unbind = SUPER CTRL, X

bindd  = , F9, Start dictation (push-to-talk), exec, talkytalky-record-start
bindrd = , F9, Stop dictation (push-to-talk), exec, voxtype record stop
bindd  = SUPER CTRL, X, Toggle dictation, exec, talkytalky record toggle
